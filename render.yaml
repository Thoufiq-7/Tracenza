# Hosted demo on Render for Tracenza (AICTE Approval Workflow & Compliance Monitoring).
# ENVIRONMENT=demo seeds the demo accounts (Admin, Scrutiny Officer, Expert, Institutions);
# use ENVIRONMENT=production for formal deployment (no synthetic demo accounts).
services:
  - type: web
    name: tracenza-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    envVars:
      - key: ENVIRONMENT
        value: demo
      - key: SEED_DEMO
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: USE_MINIO
        value: "false"
      - key: USE_CELERY
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: tracenza-db
          property: connectionString

databases:
  - name: tracenza-db
    databaseName: tracenza_compliance
    user: aicte
    plan: free
    region: singapore
